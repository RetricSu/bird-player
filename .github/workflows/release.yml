name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            extension: dmg
            features: production-data
          - os: macos-15-intel
            target: x86_64-apple-darwin
            extension: dmg
            features: production-data
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            extension: tar.gz
            features: production-data,pulseaudio
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            extension: zip
            features: production-data
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      ASSET_NAME: Bird-Player-${{ github.ref_type == 'tag' && github.ref_name || github.sha }}-${{ matrix.target }}.${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libasound2-dev libpulse-dev

      - name: Install project Rust toolchain
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          rustup toolchain install "$toolchain" --profile minimal --target "$CARGO_BUILD_TARGET"

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --locked --release --features ${{ matrix.features }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ./build_mac_app.sh
          app="target/$CARGO_BUILD_TARGET/release/Bird Player.app"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          mkdir -p dmg-root dist
          cp -R "$app" dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Bird Player" -srcfolder dmg-root \
            -ov -format UDZO "dist/$ASSET_NAME"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package dist
          cp "target/$CARGO_BUILD_TARGET/release/bird-player" package/
          cp -R assets package/
          cp README.md package/
          tar -czf "dist/$ASSET_NAME" -C package .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item "target/$env:CARGO_BUILD_TARGET/release/bird-player.exe" package/
          Copy-Item assets package/ -Recurse
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath "dist/$env:ASSET_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          cd dist
          sha256sum Bird-Player-* > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" ./* --verify-tag \
              --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
          fi
